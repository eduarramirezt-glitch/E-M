# ==========================================================
# E&M — configuración de Netlify
# ----------------------------------------------------------
# public/            → lo que se publica (página, fotos, panel /admin)
# netlify/functions/ → funciones del servidor (catálogo, panel, pagos)
# netlify/compartido → código que comparten esas funciones
# Las dependencias (package.json) se instalan en el build y NO
# quedan publicadas, porque viven fuera de public/.
# ==========================================================

[build]
  publish = "public"
  functions = "netlify/functions"

# El catálogo de arranque (perfumes.js) se empaca con las funciones
[functions]
  included_files = ["public/perfumes.js"]

# El panel no debe aparecer en Google
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
